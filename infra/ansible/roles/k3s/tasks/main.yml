---
- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s without bundled Traefik
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC='server --disable traefik --write-kubeconfig-mode=0600' sh -
  args:
    creates: /usr/local/bin/k3s
  when: not k3s_binary.stat.exists

- name: Ensure K3s service is enabled and started
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for K3s node to become ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  retries: 20
  delay: 10
  until: k3s_nodes.rc == 0
  changed_when: false

- name: Create kube directory for ubuntu user
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Copy kubeconfig for ubuntu user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/ubuntu/.kube/config
    owner: ubuntu
    group: ubuntu
    mode: "0600"
    remote_src: true

- name: Verify K3s pods
  ansible.builtin.command: k3s kubectl get pods -A
  register: k3s_pods
  changed_when: false

- name: Print K3s pods
  ansible.builtin.debug:
    var: k3s_pods.stdout_lines
