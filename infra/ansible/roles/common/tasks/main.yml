---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
      - ufw
      - git
      - jq
      - unzip
      - htop
    state: present

- name: Ensure UFW allows SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Ensure UFW allows HTTP
  community.general.ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Ensure UFW allows HTTPS
  community.general.ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled
    policy: deny
