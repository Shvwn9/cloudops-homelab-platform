apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: masterops-api
  namespace: masterops
spec:
  parentRefs:
    - name: public-gateway
      namespace: ingress-system
      sectionName: websecure
  hostnames:
    - ${MASTEROPS_HOST}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: masterops-api
          port: 8000