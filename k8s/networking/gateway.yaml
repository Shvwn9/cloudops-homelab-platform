apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: ingress-system
spec:
  gatewayClassName: traefik
  listeners:
    - name: web
      port: 8000
      protocol: HTTP
      hostname: ${MASTEROPS_HOST}
      allowedRoutes:
        namespaces:
          from: All
    - name: websecure
      port: 443
      protocol: HTTPS
      hostname: ${MASTEROPS_HOST}
      tls:
        mode: Terminate
        certificateRefs:
          - name: masterops-tls
      allowedRoutes:
        namespaces:
          from: All