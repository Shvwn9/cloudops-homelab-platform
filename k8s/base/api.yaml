apiVersion: apps/v1
kind: Deployment
metadata:
  name: masterops-api
  namespace: masterops
  labels:
    app: masterops-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: masterops-api
  template:
    metadata:
      labels:
        app: masterops-api
    spec:
      containers:
        - name: api
          image: ghcr.io/shvwn9/masterops-api:${MASTEROPS_IMAGE_TAG}
          imagePullPolicy: Always
          env:
            - name: OTEL_SERVICE_NAME
              value: masterops-api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: masterops-api
  namespace: masterops
  labels:
    app: masterops-api
spec:
  selector:
    app: masterops-api
  ports:
    - name: http
      port: 8000
      targetPort: http
